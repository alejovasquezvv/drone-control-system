<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberLogistics X-2026 · Centro de control</title>
<style>
:root{--bg:#10171f;--panel:#17212c;--line:#263444;--tx:#e8eef4;--mut:#8da0b3;--ok:#3ecf8e;--warn:#f5b83d;--bad:#ff5a5f;--acc:#4cc2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}h1 small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 14px;min-width:96px}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mut);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;padding:16px 24px}
@media(max-width:900px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
h2{font-size:15px;margin:0 0 10px}
.alert{display:none;background:rgba(255,90,95,.12);border:1px solid var(--bad);border-radius:8px;padding:10px 14px;margin:0 24px;margin-top:16px;color:#ffd3d4}
.alert.on{display:block}.alert b{color:var(--bad)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px}
.bar{display:inline-block;width:90px;height:8px;background:#0c1218;border-radius:4px;vertical-align:middle;margin-right:8px;overflow:hidden}
.bar i{display:block;height:100%}
.tag{padding:2px 8px;border-radius:10px;font-size:12px}
.t-ok{background:rgba(62,207,142,.15);color:var(--ok)}.t-warn{background:rgba(245,184,61,.15);color:var(--warn)}.t-bad{background:rgba(255,90,95,.18);color:var(--bad)}
button{font:inherit;background:#1f2e3d;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--acc);color:#05202e;border-color:var(--acc);font-weight:600}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
svg{width:100%;height:auto;background:#0c1218;border-radius:8px;display:block}
ul{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto;font-size:13px}
li{padding:6px 0;border-bottom:1px solid var(--line)}li time{color:var(--mut);margin-right:8px}
.stack{display:grid;gap:16px;align-content:start}
</style>
</head>
<body>
<header>
  <h1>CyberLogistics X-2026<small>Centro de control de drones autónomos · prototipo v0.1.0</small></h1>
  <div class="kpis">
    <div class="kpi"><b id="kTotal">0</b><span>Drones activos</span></div>
    <div class="kpi"><b id="kAlert">0</b><span>Alertas críticas</span></div>
    <div class="kpi"><b id="kLat">0 s</b><span>Latencia telemetría</span></div>
  </div>
</header>

<div class="alert" id="alertBox" role="alert"></div>

<main>
  <section>
    <h2>Flota en tiempo real</h2>
    <div class="tablewrap">
    <table>
      <thead><tr><th>Dron</th><th>Batería</th><th>Telemetría</th><th>Estado</th><th>Despegue</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="ctrl">
      <button class="primary" id="bBat">Simular batería baja (RF-01)</button>
      <button id="bTel">Simular pérdida de telemetría 9 s (RF-02)</button>
      <button id="bPin">Confirmar entrega con PIN (RF-03/06)</button>
      <button id="bReset">Restablecer flota normal</button>
    </div>
  </section>

  <div class="stack">
    <section>
      <h2>Mapa de seguimiento (RF-04)</h2>
      <svg viewBox="0 0 400 240" role="img" aria-label="Mapa con la posición de los drones">
        <g stroke="#1b2836" stroke-width="1"><path d="M0 60H400M0 120H400M0 180H400M80 0V240M160 0V240M240 0V240M320 0V240"/></g>
        <g id="map"></g>
      </svg>
    </section>
    <section>
      <h2>Registro de eventos</h2>
      <ul id="log"></ul>
    </section>
  </div>
</main>

<script>
const BASE=[
 {id:"D-101",bat:87,tel:"1,2 s",st:"En ruta",x:70,y:50},
 {id:"D-102",bat:64,tel:"1,8 s",st:"En ruta",x:150,y:110},
 {id:"D-103",bat:92,tel:"0,9 s",st:"En base",x:330,y:200},
 {id:"D-104",bat:58,tel:"1,5 s",st:"En ruta",x:250,y:70},
 {id:"D-105",bat:76,tel:"2,1 s",st:"En ruta",x:310,y:140},
 {id:"D-106",bat:41,tel:"1,3 s",st:"En base",x:60,y:190}
];
let drones, logs=[];
const $=s=>document.querySelector(s);
const now=()=>new Date().toLocaleTimeString("es-CO",{hour12:false});
function log(t){logs.unshift(`<li><time>${now()}</time>${t}</li>`);$("#log").innerHTML=logs.slice(0,30).join("")}
function color(b){return b<20?"var(--bad)":b<40?"var(--warn)":"var(--ok)"}
function render(){
  const crit=drones.filter(d=>d.bat<20);
  $("#rows").innerHTML=drones.map(d=>{
    const c=d.bat<20, lost=d.lost;
    const tag=c?'<span class="tag t-bad">Alerta crítica</span>':lost?'<span class="tag t-warn">Sin telemetría</span>':'<span class="tag t-ok">'+d.st+'</span>';
    return `<tr><td><b>${d.id}</b></td><td><span class="bar"><i style="width:${d.bat}%;background:${color(d.bat)}"></i></span>${d.bat} %</td><td>${lost?"— (9 s)":d.tel}</td><td>${tag}</td><td><button data-id="${d.id}" ${c?"disabled":""}>${c?"Bloqueado":"Autorizar"}</button></td></tr>`}).join("");
  $("#map").innerHTML=drones.map(d=>`<g><circle cx="${d.x}" cy="${d.y}" r="9" fill="${color(d.bat)}" opacity=".9"/><text x="${d.x+13}" y="${d.y+4}" fill="#e8eef4" font-size="11">${d.id} · ${d.bat} %</text></g>`).join("");
  $("#kTotal").textContent=drones.length;$("#kAlert").textContent=crit.length;$("#kLat").textContent="1,5 s";
  const a=$("#alertBox");
  if(crit.length){a.classList.add("on");a.innerHTML=`<b>Alerta crítica:</b> ${crit.map(d=>d.id).join(", ")} con batería inferior al 20 %. Autorización de despegue bloqueada hasta resolver la alerta.`}
  else a.classList.remove("on");
}
function reset(){drones=JSON.parse(JSON.stringify(BASE));logs=[];render();log("Flota normal: 6 drones conectados, sin alertas.")}
$("#bBat").onclick=()=>{const d=drones.find(x=>x.id==="D-104");d.bat=19;render();log("RF-01: batería de D-104 bajó de 21 % a 19 %. Alerta enviada al centro de control.")};
$("#bTel").onclick=()=>{const d=drones.find(x=>x.id==="D-102");d.lost=true;render();log("RF-02: pérdida de telemetría de D-102 por 9 s. Evento guardado con fecha, hora e ID.");setTimeout(()=>{d.lost=false;render()},2500)};
$("#bPin").onclick=()=>{const p=String(Math.floor(1000+Math.random()*9000));log(`RF-03/06: PIN dinámico ${p} validado. Entrega registrada.`)};
$("#bReset").onclick=reset;
$("#rows").onclick=e=>{const id=e.target.dataset.id;if(id)log(`Despegue autorizado para ${id}.`)};
reset();
</script>
</body>
</html>
